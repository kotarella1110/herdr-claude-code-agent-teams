[package]
name = "herdr-claude-code-agent-teams"
version = "0.1.3"
edition = "2024"
rust-version = "1.100"
description = "Run Claude Code agent team teammates as herdr panes."
authors = ["kotarella1110"]
license = "MIT"
repository = "https://github.com/kotarella1110/herdr-claude-code-agent-teams"
readme = "README.md"
keywords = ["herdr", "claude-code", "agent-teams", "tmux"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
strip = true
lto = "thin"
