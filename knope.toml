[package]
versioned_files = [
  "Cargo.toml",
  "Cargo.lock",
  { path = "herdr-plugin.toml", regex = '(?m)^version = "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"
assets = "artifacts/*"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this pull request releases $version.\n\n$changelog"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "kotarella1110"
repo = "herdr-claude-code-agent-teams"
